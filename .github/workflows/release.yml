name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun tsc --noEmit

      - name: Knip
        run: bun knip

      - name: ESLint
        run: bun eslint .

      - name: Test
        run: bun run test

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Smoke test dist export contract
        run: |
          bun -e "
          import('./dist/index.js').then((m) => {
            if (!m.plugin) throw new Error('missing named \`plugin\` export in dist/index.js');
            if (typeof m.plugin.onStart !== 'function') throw new Error('plugin.onStart must be a function');
            if (typeof m.plugin.onStop !== 'function') throw new Error('plugin.onStop must be a function');
            if (m.default !== m.plugin) throw new Error('default export must === named plugin export');
            console.log('dist export contract OK');
          }).catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Verify package identity
        run: |
          NAME=$(bun -e "console.log(require('./package.json').name)")
          if [ "$NAME" != "@ama-work/agent-manager" ]; then
            echo "ERROR: package.json name is '$NAME', expected '@ama-work/agent-manager'"
            exit 1
          fi
          echo "Package identity verified: $NAME"

      - name: Release
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
